name: trojan-go-caddy

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "${CADDY_HTTP_PORT:-80}:80"
      - "${CADDY_HTTPS_PORT:-443}:443"
    environment:
      - TZ=${TZ:-UTC}
    volumes:
      - ../rendered/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ../rendered/wwwroot:/srv:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      trojan-go:
        condition: service_started
    networks:
      - edge

  trojan-go:
    image: p4gefau1t/trojan-go:latest
    restart: unless-stopped
    environment:
      - TZ=${TZ:-UTC}
    volumes:
      - ../rendered/trojan-go/config.json:/etc/trojan-go/config.json:ro
      - trojan_data:/var/lib/trojan-go
    expose:
      - "${TROJAN_PORT:-8443}"
    command: ["-config", "/etc/trojan-go/config.json"]
    networks:
      - edge

  watchtower:
    image: containrrr/watchtower:latest
    profiles: ["watchtower"]
    restart: unless-stopped
    command:
      - "--cleanup"
      - "--interval"
      - "${WATCHTOWER_INTERVAL:-300}"
      - "caddy"
      - "trojan-go"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

volumes:
  caddy_data:
  caddy_config:
  trojan_data:

networks:
  edge:
    driver: bridge
